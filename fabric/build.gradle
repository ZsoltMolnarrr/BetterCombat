plugins {
    id 'com.gradleup.shadow'
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

def platform = project.name;

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    mavenCentral()
    maven {
        name = "RedlanceMinecraft"
        url = "https://repo.redlance.org/public"
    }
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.shedaniel.me' }
    maven { url 'https://maven.terraformersmc.com' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    include(implementation("maven.modrinth:tiny-config:${project.tiny_config_version}-${platform}"))

    implementation("maven.modrinth:modmenu:${project.mod_menu_version}") { transitive false }

    api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    implementation "com.zigythebird.playeranim:PlayerAnimationLibFabric:${project.player_anim_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json')  {
        def cleanedProps = project.properties.collectEntries { k, v ->
            def s = v?.toString()
            [(k.toString()): (s?.contains('+') ? s.substring(0, s.indexOf('+')) : s)]
        }
        expand(cleanedProps)
    }
}

// 26.1+ is unobfuscated: no remapJar, the shadow jar is the final artifact.
jar {
    archiveClassifier = 'raw'
}

shadowJar {
    // Build on top of the `jar` task output instead of raw source-set outputs:
    // in no-remap Loom the jar-in-jar nesting (`include`) is applied by `jar`
    // (it was applied by `remapJar` after shadowing, before 26.1).
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

// Publishing is configured unconditionally: tasks only *run* when explicitly invoked
// (e.g. `publishMod` in CI), and all credentials are lazy env providers, so a local
// `build` — with none of the tokens present — is completely unaffected.
def releaseTypeName = (project.findProperty('release_type') ?: 'beta').toString()

// Preserve the `publishMod` task name so the GitHub Actions workflow keeps working.
tasks.register("publishMod") {
    dependsOn(build)
    finalizedBy(tasks.named("publishMods"))
}

publishMods {
    file = shadowJar.archiveFile
    changelog = providers.provider { changelog_last_section() }   // lazy: read only at publish
    type = releaseTypeName == "release" ? me.modmuss50.mpp.ReleaseType.STABLE
            : releaseTypeName == "alpha" ? me.modmuss50.mpp.ReleaseType.ALPHA
            : me.modmuss50.mpp.ReleaseType.BETA
    version = "${project.version}-fabric" // Will fail if Modrinth already has this version
    displayName = "${project.version}"
    modLoaders.add("fabric")

    curseforge {
        projectId = providers.environmentVariable("CURSEFORGE_PROJECT_ID")
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        client = true
        server = true
        rootProject.ext.publishGameVersions().each { minecraftVersions.add(it) }
        requires("fabric-api")
        requires("cloth-config")
        requires("player-animation-library")
    }

    modrinth {
        projectId = providers.environmentVariable("MODRINTH_PROJECT_ID").map { rootProject.ext.resolveModrinthId(it) }
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        rootProject.ext.publishGameVersions().each { minecraftVersions.add(it) }
        requires("fabric-api")
        requires("cloth-config")
        requires("player-animation-library")
    }

    // Each platform publishes its own GitHub release under a distinct, platform-suffixed
    // tag (e.g. `2.3.1+26.1-fabric`), so the two publish jobs don't collide.
    github {
        repository = providers.environmentVariable("GH_OWNER")
                .zip(providers.environmentVariable("GH_REPO")) { owner, repo -> "$owner/$repo" }
        accessToken = providers.environmentVariable("GH_API_KEY")
        tagName = "${project.version}-${platform}"
        // `commitish` is REQUIRED by the plugin. GITHUB_SHA is set automatically by GitHub
        // Actions to the triggering commit — valid even in a detached-HEAD checkout.
        commitish = providers.environmentVariable("GITHUB_SHA")
    }
}