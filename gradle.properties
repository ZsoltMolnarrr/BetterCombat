# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx3G

# Mod properties
mod_version = 3.1.0
maven_group = net.bettercombat
archives_name = bettercombat
enabled_platforms = fabric,neoforge

# Minecraft properties
# 26.1 is the first unobfuscated Minecraft version: no Yarn, no mappings, no remapping.
minecraft_version = 26.1.2

# Dependencies
fabric_loader_version = 0.19.3
fabric_api_version = 0.154.2+26.1.2
neoforge_version = 26.1.2.76

# No 26.1 build published yet, but contains no Minecraft class references,
# and declares open ended dependency `"minecraft": ">=1.21"`, so it keeps working.
tiny_config_version=3.1.0

cloth_config_version=26.1.154
player_anim_version=1.2.4+mc.26.1

# Compatibility
mod_menu_version=18.0.0

# TODO: Restore compile-only compat dependencies once 26.1 builds are published.
# Pre-26.1 jars are intermediary-mapped and unusable in an unobfuscated toolchain.
#fpm_version=2.4.9
#spell_engine_version=1.8.16+1.21.1
#ftb_teams_version=2101.1.2
#ftb_library_version=2101.1.7

# Architectury Loom (no-remap) is in beta for 26.1
loom.ignoreDependencyLoomVersionValidation=true
