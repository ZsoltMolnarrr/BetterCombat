# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx3G

# Mod properties
mod_version = 3.2.2
maven_group = net.bettercombat
archives_name = bettercombat
enabled_platforms = fabric,neoforge

# Minecraft properties
# 26.x is unobfuscated: no Yarn, no mappings, no remapping.
minecraft_version = 26.3
# Older 26.x versions this release is also compatible with, for publish game version tags (comma-separated, excludes minecraft_version)
additional_game_versions =

# Dependencies
fabric_loader_version = 0.19.5
fabric_api_version = 0.160.6+26.3
neoforge_version = 26.3.0.3-beta

tiny_config_version=4.0.0


cloth_config_version=26.3.158
player_anim_version=1.2.7+mc.26.3

# Compatibility
mod_menu_version=21.0.0-beta.1

# First Person Model 2.7.2 (Modrinth version id of the fabric mc26.2 build,
# because plain "2.7.2" is ambiguous across loaders/game versions on the Modrinth maven)
fpm_version=6sgz2HEq

# No 26.2 build yet. 26.1 jars are unobfuscated, so they stay usable as compileOnly;
# runtime integration is guarded by isModLoaded("ftbteams").
ftb_teams_version=26.1.2.4
ftb_library_version=26.1.2.6

# TODO: Restore compile-only compat dependencies once 26.1 builds are published.
# Pre-26.1 jars are intermediary-mapped and unusable in an unobfuscated toolchain.
#spell_engine_version=1.8.16+1.21.1

# Architectury Loom (no-remap) is in beta for 26.1
loom.ignoreDependencyLoomVersionValidation=true
