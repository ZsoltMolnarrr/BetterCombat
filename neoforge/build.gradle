plugins {
    id 'com.gradleup.shadow'
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

def platform = project.name;

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    mavenCentral()
    maven {
        name = "RedlanceMinecraft"
        url = "https://repo.redlance.org/public"
    }
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.terraformersmc.com/' }
    maven { url 'https://jitpack.io' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    //forgeRuntimeLibrary "org.javassist:javassist:3.30.2-GA"
    implementation("com.zigythebird.playeranim:PlayerAnimationLibNeo:${project.player_anim_version}")
    api("me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}")
    include(implementation("maven.modrinth:tiny-config:${project.tiny_config_version}-${platform}"))
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        def cleanedProps = project.properties.collectEntries { k, v ->
            def s = v?.toString()
            [(k.toString()): (s?.contains('+') ? s.substring(0, s.indexOf('+')) : s)]
        }
        expand(cleanedProps)
    }
}

// 26.1+ is unobfuscated: no remapJar, the shadow jar is the final artifact.
jar {
    archiveClassifier = 'raw'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

if (project.hasProperty('release_type')) {
    def mppType = release_type == "release" ? me.modmuss50.mpp.ReleaseType.STABLE
            : release_type == "alpha" ? me.modmuss50.mpp.ReleaseType.ALPHA
            : me.modmuss50.mpp.ReleaseType.BETA

    // Preserve the `publishMod` task name so the GitHub Actions workflow keeps working.
    tasks.register("publishMod") {
        dependsOn(build)
        finalizedBy(tasks.named("publishMods"))
    }

    publishMods {
        file = shadowJar.archiveFile
        changelog = changelog_last_section()
        type = mppType
        version = "${project.version}-neoforge" // Will fail if Modrinth already has this version
        displayName = "${project.version}"
        modLoaders.add("neoforge")

        curseforge {
            projectId = providers.environmentVariable("CURSEFORGE_PROJECT_ID")
            accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
            client = true
            server = true
            rootProject.ext.publishGameVersions().each { minecraftVersions.add(it) }
            requires("cloth-config")
            requires("player-animation-library")
        }

        modrinth {
            projectId = providers.environmentVariable("MODRINTH_PROJECT_ID")
            accessToken = providers.environmentVariable("MODRINTH_API_KEY")
            rootProject.ext.publishGameVersions().each { minecraftVersions.add(it) }
            requires("cloth-config")
            requires("player-animation-library")
        }
    }
}